# ============================================================
# Site-wide settings for the Quarto website.
# Every page inherits these options unless the page overrides them
# in its own front matter (the block between --- lines at the top).
# ============================================================

project:
  type: website           # build a multi-page website (not a single document)
  output-dir: docs        # rendered HTML goes to docs/, which GitHub Pages serves
  resources:
    - FelipeAlmeida-CV.pdf   # extra files copied as-is into docs/

website:
  title: "Felipe Almeida"                     # name at the top-left of the navbar and in browser tabs
  site-url: https://felipeeconomist.github.io # public address; used for sitemap.xml and share previews
  description: "Felipe Almeida – PhD candidate in Agricultural Economics at the University of Nebraska–Lincoln."  # summary for Google and link previews
  favicon: images/favicon.png                 # small icon shown in the browser tab
  image: images/profile.jpg                   # picture used in link previews (LinkedIn, WhatsApp, X)
  open-graph: true                            # add preview tags for LinkedIn, WhatsApp, Facebook
  twitter-card:
    card-style: summary                       # small square image next to the text on X/Twitter

  # Top menu. Items appear left to right in this order.
  navbar:
    right:
      - href: index.qmd
        text: Home
      - href: research.qmd
        text: Research
      - href: projects.qmd
        text: Projects
      - href: experience.qmd
        text: Experience
      - href: education.qmd
        text: Education
      - href: FelipeAlmeida-CV.pdf   # opens the PDF directly
        text: CV

  # Footer shown at the bottom of every page.
  # {{< fa ... >}} inserts a Font Awesome icon (from _extensions/quarto-ext/fontawesome).
  page-footer:
    background: light
    left: © 2026 Felipe Almeida
    right: This website is built with [{{< fa brands github title="GitHub octocat logo" >}}](https://github.com/felipeeconomist/felipeeconomist.github.io){target=_blank}, [{{< fa brands r-project title="R Project" >}}](https://www.r-project.org/about.html){target=_blank} and [Quarto](https://quarto.org/){target=_blank}

format:
  html:
    theme: cosmo                   # Bootstrap theme from bootswatch.com; styles.css adjusts it
    css: styles.css                # custom styles for the whole site
    page-layout: full              # use the full page grid; styles.css limits it to 1040px
    link-external-newwindow: true  # links to other websites open in a new tab
    html-math-method: plain        # do not load MathJax (the site has no equations)

editor: visual   # RStudio opens .qmd files in the visual editor
