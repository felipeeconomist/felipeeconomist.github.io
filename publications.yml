# Entries shown on the Research page (research.qmd), in the order they appear here.
#
# Fields
#   section       wip | review | articles | chapters | reports | opeds | presentations | talks
#   authors       author list, as it should be printed
#   year          year, or "Month Year" for talks
#   title         title (a period is added unless it ends in ? or !)
#   italic_title  true to print the title in italics (working papers, reports, op-eds)
#   pre           plain text after the title, before the venue (e.g. "Presented at the")
#   venue         journal, book, newsletter or conference, printed in italics
#   post          plain text right after the venue (e.g. ", 10, txag137.")
#   url           link; the label is DOI, PDF or Article, chosen from the address
#   label         optional, overrides the automatic link label
#   tag           optional small label under the entry (e.g. "Dissertation chapter")

